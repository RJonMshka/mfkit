name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default; release.yml scopes its own write permissions.
permissions:
  contents: read

# A new push to the same PR supersedes the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines.node is ">=22": both maintained LTS lines. (Node 20 dropped —
        # EOL since 2026-04, see docs/project-review-2026-10.md O8.)
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-node${{ matrix.node }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-node${{ matrix.node }}-

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test (with coverage report)
        run: pnpm test:coverage

  example:
    name: example (smoke + e2e)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # Invariant 3: the manifest is the single source of truth. Committed
      # generated artifacts must match what the manifest produces today.
      - name: Generated artifacts are up to date
        run: |
          pnpm --filter mfkit-example-minimal gen
          git diff --exit-code -- examples/minimal/.mfkit/generated \
            || { echo "::error::examples/minimal/.mfkit/generated is stale — run 'pnpm --filter mfkit-example-minimal gen' and commit."; exit 1; }

      - name: Example smoke test (HTTP)
        run: pnpm --filter mfkit-example-minimal smoke

      - name: Example e2e (headless Chrome)
        run: pnpm --filter mfkit-example-minimal e2e

      # L5: dev and build take different paths (dev remotes, Vite's CSS
      # handling, the MF dev runtime) — run the same assertions against both.
      - name: Example e2e against dev servers
        run: pnpm --filter mfkit-example-minimal e2e:dev

      # L6: break a remote at the network layer and assert the shell keeps
      # running, retries really refetch, and quarantine/recovery work.
      - name: Example fault injection (headless Chrome)
        run: pnpm --filter mfkit-example-minimal faults

  package:
    name: package correctness
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # What consumers actually install: exports map, files, and types must
      # resolve. ESM-only by design, so CJS/node10 resolution is out of scope.
      - name: publint + are-the-types-wrong
        run: |
          for pkg in plugin-api kit codemods; do
            echo "::group::$pkg"
            (cd packages/$pkg && npx --yes publint@0.3 --strict && npx --yes @arethetypeswrong/cli@0.18 --pack --profile esm-only)
            echo "::endgroup::"
          done

      # L2: the committed API reports must match the built .d.ts surface.
      - name: API report is up to date
        run: pnpm api:check

      # L4: install the tarballs into a fresh Svelte-only project and use them —
      # proves optional peers stay optional and the mfkit-migrate bin runs.
      - name: Pack, install, and use
        run: pnpm pack-check
