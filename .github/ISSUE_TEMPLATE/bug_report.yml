name: Bug report
description: Something in @mfkit/* behaves differently than documented.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The fastest bugs to fix come with a reproduction —
        ideally a fork of `examples/minimal` with the smallest change that breaks it.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Repo link or minimal steps. Include your `mfkit.config.ts` (trimmed) if relevant.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - defineConfig / validation
        - "@mfkit/kit/vite (config generation)"
        - "@mfkit/kit/react (outlet / provider)"
        - "@mfkit/kit/healing"
        - "@mfkit/kit/types or /turbo (generators)"
        - "@mfkit/codemods (mfkit-migrate)"
        - "@mfkit/plugin-api (types)"
        - Docs
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Where does it fail?
      options: [dev server, production build, browser runtime, typecheck, CLI]
  - type: textarea
    id: env
    attributes:
      label: Versions
      description: Output of `pnpm ls @mfkit/kit @module-federation/vite vite react svelte vue --depth 0` and `node -v`.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Full error output, including any `[mfkit]` lines and `MFKitConfigError` issue lists.
      render: text
